services:
  gunicorn:
    build:
      context: ../../
      dockerfile: docker/prod/Dockerfile
    container_name: cashya-shoppy-gunicorn
    restart: unless-stopped
    env_file:
      - ../../.env.prod
    volumes:
      - ../../:/app
      - ../../data:/app/data
    ports:
      - 5025:8000

volumes:
  data:
    name: "cashya-shoppy-data"
