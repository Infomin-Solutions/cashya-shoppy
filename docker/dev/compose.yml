services:
  backend:
    build:
      context: ../../
      dockerfile: docker/dev/Dockerfile
    container_name: cashya-shoppy-backend-dev
    restart: unless-stopped
    env_file:
      - ../../.env
    volumes:
      - ../../:/app
      - ../../data:/app/data
    ports:
      - 8000:8000
      - 5678:5678
